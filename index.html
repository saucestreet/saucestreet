<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100916">
  <meta name="description" content="SauceStreet® — Streetwear, oversized tees, caps and football culture. Find your style. Own your energy.">
  <meta property="og:title" content="SauceStreet® | Streetwear & Football Culture">
  <meta property="og:description" content="Streetwear with attitude. Discover the SauceStreet collection.">
  <meta property="og:type" content="website">

  <title>SauceStreet® | Streetwear & Football Culture</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #100916;
      --bg-soft: #170e20;
      --surface: #201329;
      --surface-light: #2b1937;
      --purple: #bd78ff;
      --purple-light: #d9b3ff;
      --purple-dark: #7438a8;
      --white: #fbf7ff;
      --muted: #b9a9c5;
      --border: rgba(217, 179, 255, 0.16);
      --max-width: 1240px;
      --radius: 18px;
      --transition: 220ms ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 95px;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: "DM Sans", sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input {
      font: inherit;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--purple-light);
      outline-offset: 4px;
    }

    ::selection {
      background: var(--purple);
      color: #160c20;
    }

    .container {
      width: min(var(--max-width), calc(100% - 48px));
      margin-inline: auto;
    }

    .section {
      padding: 100px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--purple-light);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--purple);
    }

    .section-heading {
      max-width: 650px;
      margin-bottom: 42px;
    }

    .section-heading h2 {
      margin-top: 13px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .section-heading p {
      max-width: 540px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .accent {
      color: var(--purple);
    }

    /* Announcement bar */

    .announcement {
      position: relative;
      z-index: 20;
      padding: 9px 16px;
      background: var(--purple);
      color: #180b22;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    /* Header and navigation */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      background: rgba(16, 9, 22, 0.94);
      backdrop-filter: blur(18px);
    }

    .nav {
      display: flex;
      min-height: 78px;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .logo {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid rgba(217, 179, 255, 0.55);
      border-radius: 12px;
      background: linear-gradient(135deg, #382044, #170d21);
      box-shadow: 0 0 24px rgba(189, 120, 255, 0.13);
      color: var(--purple-light);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 21px;
      font-weight: 900;
    }

    .logo-name {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .logo-name span {
      color: var(--purple);
    }

    .logo-tagline {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: #d2c5db;
      font-size: 11px;
      font-weight: 700;
      transition: color var(--transition);
    }

    .nav-links a:hover {
      color: var(--purple-light);
    }

    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: var(--purple);
      color: #190c23;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
      transition:
        transform var(--transition),
        background var(--transition),
        box-shadow var(--transition);
    }

    .button:hover {
      transform: translateY(-3px);
      background: var(--purple-light);
      box-shadow: 0 8px 28px rgba(189, 120, 255, 0.2);
    }

    .button-outline {
      border-color: rgba(217, 179, 255, 0.45);
      background: rgba(20, 10, 29, 0.55);
      color: var(--white);
    }

    .button-outline:hover {
      border-color: var(--purple);
      background: rgba(189, 120, 255, 0.12);
      color: var(--purple-light);
    }
